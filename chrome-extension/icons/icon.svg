<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#020208"/>

  <!-- Neon grid pattern -->
  <line x1="20" y1="20" x2="108" y2="20" stroke="#00ffcc" stroke-width="2" opacity="0.8"/>
  <line x1="20" y1="108" x2="108" y2="108" stroke="#ff00ff" stroke-width="2" opacity="0.8"/>
  <line x1="20" y1="20" x2="20" y2="108" stroke="#00ffcc" stroke-width="2" opacity="0.8"/>
  <line x1="108" y1="20" x2="108" y2="108" stroke="#ff00ff" stroke-width="2" opacity="0.8"/>

  <!-- Center circle (portal) -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.9"/>
  <circle cx="64" cy="64" r="25" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.6"/>

  <!-- Inner design -->
  <path d="M 45 64 L 64 45 L 83 64 L 64 83 Z" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.8"/>

  <!-- Glow effect (filter in SVG would be better, but this works) -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.3"/>
</svg>
