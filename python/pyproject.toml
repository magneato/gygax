[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gygax"
version = "0.2.0"
description = "Python bindings and client for the Gygax agent runtime and neuromorphic simulator"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause-Clear" }
dependencies = []

[project.optional-dependencies]
analysis = ["numpy"]

[tool.setuptools]
packages = ["gygax"]
