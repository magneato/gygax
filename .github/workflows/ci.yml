name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux (clang-18) build, test, lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 clang-format-18 clang-tidy-18 cppcheck cmake ninja-build python3 curl libeigen3-dev libgmp-dev

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Virtual CAN interface
        run: |
          sudo apt-get install -y linux-modules-extra-$(uname -r) iproute2 || true
          sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0 || echo "vcan unavailable; SocketCAN test will skip"

      - name: Test
        run: ctest --preset dev

      - name: Lint
        run: BUILD_DIR=build/dev ./scripts/lint.sh all

      - name: Live daemon smoke test
        run: |
          ./build/dev/gygax serve --port 19884 --token ci-token > serve.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS localhost:19884/readyz >/dev/null 2>&1 && break; sleep 0.2; done
          ./build/dev/gygax doctor --url http://127.0.0.1:19884 --token ci-token --full
          kill -TERM %1
          wait %1
          grep -q "shutting down" serve.log

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 cmake ninja-build python3 libeigen3-dev libgmp-dev
      - run: cmake --preset ${{ matrix.preset }} -DGYGAX_BUILD_EXAMPLES=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  package:
    name: Package and container
    runs-on: ubuntu-24.04
    needs: linux
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 cmake ninja-build python3 libeigen3-dev libgmp-dev
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: cpack --config build/release/CPackConfig.cmake -G "DEB;TGZ"
      - uses: actions/upload-artifact@v5
        with:
          name: gygax-packages
          path: |
            gygax_*.deb
            gygax-*.tar.gz
      - name: Container build and health check
        run: |
          docker build -t gygax:ci .
          docker run -d --name gygax-ci -e GYGAX_API_TOKEN=ci-token -p 1984:1984 gygax:ci
          for i in $(seq 1 30); do curl -fsS localhost:1984/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-token" localhost:1984/v1/models
          docker stop gygax-ci

  macos:
    name: macOS (Homebrew clang, best effort)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: brew install llvm ninja cmake eigen gmp
      - name: Configure with Homebrew clang (Apple clang 15 has no C++26)
        run: |
          LLVM="$(brew --prefix llvm)"
          LIBCXX="-L$LLVM/lib/c++ -Wl,-rpath,$LLVM/lib/c++"
          cmake --preset macos-clang -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_EXE_LINKER_FLAGS="$LIBCXX" -DCMAKE_SHARED_LINKER_FLAGS="$LIBCXX"
      - run: cmake --build --preset macos-clang
      - run: ctest --preset macos-clang

  windows:
    # Hosted Windows runners cannot run Linux containers, so the Docker pipeline that
    # build.ps1 drives is covered by the Linux "package" job. Here every PowerShell
    # script must at least parse.
    name: Windows PowerShell scripts parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "ok  $($_.FullName)" }
          }
          if ($bad) { exit 1 }
